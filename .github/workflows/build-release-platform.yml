name: build-release-platform

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      runner:
        required: true
        type: string
      windows_desktop:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Linux container host
        if: runner.os == 'Linux'
        run: docker version
      - name: Mac build prerequisites
        if: runner.os == 'macOS'
        run: command -v cmake >/dev/null || brew install cmake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Prepare pinned CPA source
        if: runner.os != 'Windows'
        run: |
          repository=$(python3 -c 'import json; print(json.load(open("vendor/cpa/source.json"))["repository"])')
          revision=$(python3 -c 'import json; print(json.load(open("vendor/cpa/source.json"))["commit"])')
          git init "$RUNNER_TEMP/cpa"
          git -C "$RUNNER_TEMP/cpa" fetch --depth=1 "$repository" "$revision"
          git -C "$RUNNER_TEMP/cpa" checkout --detach FETCH_HEAD
      - name: Prepare pinned CPA source on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pin = Get-Content vendor/cpa/source.json -Raw | ConvertFrom-Json
          git init "$env:RUNNER_TEMP/cpa"
          git -C "$env:RUNNER_TEMP/cpa" fetch --depth=1 $pin.repository $pin.commit
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CPA fetch failed' }
          git -C "$env:RUNNER_TEMP/cpa" checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CPA checkout failed' }
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/cpa/go.mod
          cache: false
      - name: Repository Rust toolchain
        shell: bash
        env:
          RELEASE_TARGET: ${{ inputs.target }}
        run: rustup show active-toolchain && rustup target add "$RELEASE_TARGET"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-sources-${{ inputs.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Build and verify the exact candidate
        if: runner.os != 'Windows'
        env:
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          python3 scripts/ci-run.py --name release-candidate --expected-sha "$GITHUB_SHA" \
            --timeout 6600 --plan release-platforms --phase final -- \
            python3 scripts/build-release.py --target "$RELEASE_TARGET" \
            --cpa-source-repo "$RUNNER_TEMP/cpa"
      - name: Build and verify the exact Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          WINDOWS_DESKTOP: ${{ inputs.windows_desktop }}
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Exact dispatch SHA required' }
          $desktop = @()
          if ($env:WINDOWS_DESKTOP -eq 'true') { $desktop = @('--windows-desktop') }
          python scripts/build-release.py --target $env:RELEASE_TARGET --cpa-source-repo "$env:RUNNER_TEMP/cpa" @desktop
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows candidate build failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ inputs.target }}${{ inputs.windows_desktop && '-desktop' || '' }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/release-candidate/**/assets/*
            target/release-candidate/**/result.json
            target/release-candidate/**/build.log
            target/release-candidate/**/linux-abi.json
            target/release-candidate/**/runtime/*.log
            target/release-candidate/**/runtime/diagnostics/**/*.jsonl
            target/release-candidate/**/*.provenance.json
            target/desktop-package/**/result.json
            target/desktop-package/**/build.log
            artifacts/ci
          if-no-files-found: error
          retention-days: 14
