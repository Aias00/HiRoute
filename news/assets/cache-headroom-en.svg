<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img"><title>A cache loss is small next to the routing savings</title><rect width="1000" height="490" rx="20" fill="#eef2fa"/><g font-family="system-ui,sans-serif" fill="#192439"><text x="32" y="46" font-size="24" font-weight="700">A cache loss is small next to the routing savings</text><text x="32" y="76" font-size="15" fill="#536079">Astra × Qwen experiment, pair 3 (the accepted pair with the smaller margin), USD per task</text><text x="32.0" y="130.0" font-size="15" font-weight="700" text-anchor="start" fill="#536079">Whole-task cost</text><text x="318.0" y="165.0" font-size="14" font-weight="400" text-anchor="end" fill="#192439">All Astra (recorded)</text><rect x="330" y="148" width="498.0" height="26" rx="4" fill="#5564bd"/><text x="836.0" y="166.0" font-size="14" font-weight="700" text-anchor="start" fill="#192439">$2.067</text><text x="318.0" y="205.0" font-size="14" font-weight="400" text-anchor="end" fill="#192439">All Astra, every input cached</text><rect x="330" y="188" width="441.3" height="26" rx="4" fill="#8592d6"/><text x="779.3" y="206.0" font-size="14" font-weight="700" text-anchor="start" fill="#192439">$1.832</text><text x="318.0" y="245.0" font-size="14" font-weight="400" text-anchor="end" fill="#192439">HiRoute mixed, Qwen with no cache hits</text><rect x="330" y="228" width="42.9" height="26" rx="4" fill="#078677"/><text x="380.9" y="246.0" font-size="14" font-weight="700" text-anchor="start" fill="#192439">$0.178</text><text x="32.0" y="290.0" font-size="15" font-weight="700" text-anchor="start" fill="#536079">One cache loss (cache-write price)</text><text x="318.0" y="325.0" font-size="14" font-weight="400" text-anchor="end" fill="#192439">Astra loses 100,000 tokens</text><rect x="330" y="308" width="277.0" height="26" rx="4" fill="#d0652a"/><text x="615.0" y="326.0" font-size="14" font-weight="700" text-anchor="start" fill="#192439">$1.150</text><text x="318.0" y="365.0" font-size="14" font-weight="400" text-anchor="end" fill="#192439">Astra loses 10,000 tokens</text><rect x="330" y="348" width="27.7" height="26" rx="4" fill="#d0652a"/><text x="365.7" y="366.0" font-size="14" font-weight="700" text-anchor="start" fill="#192439">$0.115</text><text x="318.0" y="405.0" font-size="14" font-weight="400" text-anchor="end" fill="#192439">Qwen loses 100,000 tokens</text><rect x="330" y="388" width="4.1" height="26" rx="4" fill="#d0652a"/><text x="342.1" y="406.0" font-size="14" font-weight="700" text-anchor="start" fill="#192439">$0.017</text><path d="M 448.9 241 H 771.3 V 214" fill="none" stroke="#078677" stroke-width="2" stroke-dasharray="6 4"/><text x="783.3" y="246.0" font-size="15" font-weight="700" text-anchor="start" fill="#056356">Headroom $1.65</text><text x="32.0" y="448.0" font-size="13" font-weight="400" text-anchor="start" fill="#536079">Headroom = all-Astra with every input cached − mixed upper bound: the extra overhead mixed routing can absorb.</text></g></svg>
