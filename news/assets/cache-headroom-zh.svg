<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img"><title>一次缓存损失，远小于混合路由省下的钱</title><rect width="1000" height="490" rx="20" fill="#eef2fa"/><g font-family="system-ui,sans-serif" fill="#192439"><text x="32" y="46" font-size="24" font-weight="700">一次缓存损失，远小于混合路由省下的钱</text><text x="32" y="76" font-size="15" fill="#536079">Astra × Qwen 实验第 3 组（两组达标运行中余量较小的一组），美元/单</text><text x="32.0" y="130.0" font-size="15" font-weight="700" text-anchor="start" fill="#536079">整单成本</text><text x="318.0" y="165.0" font-size="14" font-weight="400" text-anchor="end" fill="#192439">全用 Astra（实际）</text><rect x="330" y="148" width="498.0" height="26" rx="4" fill="#5564bd"/><text x="836.0" y="166.0" font-size="14" font-weight="700" text-anchor="start" fill="#192439">$2.067</text><text x="318.0" y="205.0" font-size="14" font-weight="400" text-anchor="end" fill="#192439">全用 Astra（假设输入全命中缓存）</text><rect x="330" y="188" width="441.3" height="26" rx="4" fill="#8592d6"/><text x="779.3" y="206.0" font-size="14" font-weight="700" text-anchor="start" fill="#192439">$1.832</text><text x="318.0" y="245.0" font-size="14" font-weight="400" text-anchor="end" fill="#192439">HiRoute 混合（Qwen 零缓存命中）</text><rect x="330" y="228" width="42.9" height="26" rx="4" fill="#078677"/><text x="380.9" y="246.0" font-size="14" font-weight="700" text-anchor="start" fill="#192439">$0.178</text><text x="32.0" y="290.0" font-size="15" font-weight="700" text-anchor="start" fill="#536079">一次缓存损失（按缓存写入价）</text><text x="318.0" y="325.0" font-size="14" font-weight="400" text-anchor="end" fill="#192439">Astra 丢 10 万 token</text><rect x="330" y="308" width="277.0" height="26" rx="4" fill="#d0652a"/><text x="615.0" y="326.0" font-size="14" font-weight="700" text-anchor="start" fill="#192439">$1.150</text><text x="318.0" y="365.0" font-size="14" font-weight="400" text-anchor="end" fill="#192439">Astra 丢 1 万 token</text><rect x="330" y="348" width="27.7" height="26" rx="4" fill="#d0652a"/><text x="365.7" y="366.0" font-size="14" font-weight="700" text-anchor="start" fill="#192439">$0.115</text><text x="318.0" y="405.0" font-size="14" font-weight="400" text-anchor="end" fill="#192439">Qwen 丢 10 万 token</text><rect x="330" y="388" width="4.1" height="26" rx="4" fill="#d0652a"/><text x="342.1" y="406.0" font-size="14" font-weight="700" text-anchor="start" fill="#192439">$0.017</text><path d="M 448.9 241 H 771.3 V 214" fill="none" stroke="#078677" stroke-width="2" stroke-dasharray="6 4"/><text x="783.3" y="246.0" font-size="15" font-weight="700" text-anchor="start" fill="#056356">余量 $1.65</text><text x="32.0" y="448.0" font-size="13" font-weight="400" text-anchor="start" fill="#536079">余量 = 全用 Astra（输入全命中缓存）− 混合路由上限。混合方案在不亏的前提下，还能额外承受这么多开销。</text></g></svg>
